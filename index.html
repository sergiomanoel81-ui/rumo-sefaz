<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#185fa5" />
  <title>Rumo à SEFAZ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="concurso">
        <strong>SEFAZ-BA</strong> · Agente de Tributos
      </div>
      <span class="chip" id="chip-prova">edital em breve</span>
    </header>

    <main class="main">
      <section class="view active" id="view-hoje"></section>
      <section class="view" id="view-cronograma"></section>
      <section class="view" id="view-registrar"></section>
      <section class="view" id="view-revisoes"></section>
    </main>

    <nav class="nav" id="nav">
      <button data-view="hoje" class="on"><span class="ic">🏠</span>Hoje</button>
      <button data-view="cronograma"><span class="ic">📅</span>Cronograma</button>
      <button data-view="registrar"><span class="ic">⏱️</span>Registrar</button>
      <button data-view="revisoes"><span class="ic">🔄</span>Revisões</button>
    </nav>
  </div>

  <script src="data.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
